name: episignalr_env_v1.0

# add pb-cpg-tools
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Core tools
  - python>=3.13
  
  # Bioinformatics tools
  - ont-modkit=0.6.1
  - samtools=1.22
  - bedtools=2.31.1
  - pb-cpg-tools
  
  # Python packages
  - pandas
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn=1.8.0
  
  # Development tools
  - pip